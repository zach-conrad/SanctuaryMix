name: CI

# Every push and PR runs the fast checks first (a few minutes). The slower
# macOS and Windows builds only start once those pass, so a typo fails fast and
# doesn't burn macOS minutes. "CI passed" is the one check branch protection
# should require. The release workflow calls this file too, so a tag can never
# ship without the same checks.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev librsvg2-dev
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The launch site (website/), when present. Built here so a broken page is
  # caught on the PR, not at deploy time.
  website:
    name: Website build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check the site exists
        id: site
        run: if [ -f website/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.site.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build site
        if: steps.site.outputs.exists == 'true'
        working-directory: website
        run: npm ci && npm run build

  macos:
    name: macOS app (.app + .dmg)
    needs: [web, rust]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run app:build:mac
      # macOS ties the microphone grant to the app's signature. An unsealed
      # bundle or a missing audio-input entitlement brings the prompt back.
      - name: Check signature and microphone entitlement
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/SanctuaryMix.app
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | tee sig.txt
          grep -q "^Identifier=app.sanctuarymix.desktop$" sig.txt
          grep -q "Info.plist entries=" sig.txt
          codesign -d --entitlements - --xml "$app" | grep -q "com.apple.security.device.audio-input"
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
      # On a PR this is the preview build: download it from the run's
      # Summary page to try the change on a real Mac.
      - uses: actions/upload-artifact@v7
        with:
          name: sanctuarymix-macos-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build check
    needs: [web, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Clippy here catches Windows-only code (cfg(windows), WASAPI paths).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # One stable check name for branch protection, so adding or renaming jobs
  # above never needs a settings change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [web, rust, website, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed ($r)."
              exit 1
            fi
          done
