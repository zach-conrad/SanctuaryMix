name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: macOS app (.app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run app:build:mac
      # macOS ties the microphone grant to the app's signature. An unsealed
      # bundle or a missing audio-input entitlement brings the prompt back.
      - name: Check signature and microphone entitlement
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/SanctuaryMix.app
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | tee sig.txt
          grep -q "^Identifier=app.sanctuarymix.desktop$" sig.txt
          grep -q "Info.plist entries=" sig.txt
          codesign -d --entitlements - --xml "$app" | grep -q "com.apple.security.device.audio-input"
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: sanctuarymix-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  windows:
    name: Windows build check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
