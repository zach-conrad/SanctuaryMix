name: Dev build

# The dev channel. After CI passes on main, build the Mac and Windows apps
# against the development environment and publish them to a rolling "dev"
# prerelease that always holds the newest main build:
#   https://github.com/<owner>/<repo>/releases/tag/dev
# Nothing here touches production. Real releases go through release.yml.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment: development
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            build: npm run app:build:mac
          - name: Windows
            os: windows-latest
            targets: ""
            build: npm run tauri -- build --bundles nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}
      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.targets }}" ]; then rustup target add ${{ matrix.targets }}; fi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: ${{ matrix.build }}
        env:
          # Environment-specific config comes from the "development" environment's
          # variables, so dev builds can never point at production services.
          VITE_APP_CHANNEL: dev
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Collect installer under a fixed name
        shell: bash
        run: node scripts/collect-bundles.mjs dist-release SanctuaryMix-dev
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish dev prerelease
    needs: build
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          merge-multiple: true
      - name: Replace the rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist-release
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist-release/* \
            --prerelease \
            --target "$BUILD_SHA" \
            --title "Dev build ${BUILD_SHA::7}" \
            --notes "Latest build of main ($BUILD_SHA). For testing only: not signed, may be unstable."
