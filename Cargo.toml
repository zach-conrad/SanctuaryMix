[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["SanctuaryMix contributors"]

[workspace.dependencies]
mix-core = { path = "crates/mix-core" }
audio-engine = { path = "crates/audio-engine" }
console = { path = "crates/console" }
auth = { path = "crates/auth" }

anyhow = "1"
async-trait = "0.1"
cpal = "0.15"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
