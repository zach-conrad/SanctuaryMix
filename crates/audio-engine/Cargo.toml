[package]
name = "audio-engine"
description = "Multichannel audio capture (Dante Virtual Soundcard via CoreAudio/WASAPI) and metering."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mix-core.workspace = true
cpal.workspace = true
hound.workspace = true
log.workspace = true
rtrb.workspace = true
serde.workspace = true
thiserror.workspace = true

# Microphone permission prompt (AVFoundation); see src/permission.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
