# cargo-deny: checks Rust dependencies for security advisories, license
# problems, duplicate/banned crates and untrusted sources.
# Run locally with `cargo deny check`. CI runs it in .github/workflows/security.yml.

[graph]
# Only check what we actually ship (Linux is CI-only, so its GTK tree is skipped).
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# Fail on vulnerabilities and on yanked crates. Every ignore needs a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses we can ship in a closed-source app.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own workspace crates are UNLICENSED and never published.
ignore = true

[bans]
# Duplicate versions are common in the Tauri tree; warn, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
