[package]
name = "sanctuary-mix"
description = "SanctuaryMix desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "sanctuary_mix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mix-core.workspace = true
audio-engine.workspace = true
console.workspace = true
auth.workspace = true
recorder.workspace = true
automix.workspace = true
tonal.workspace = true
store.workspace = true
listen.workspace = true

async-trait.workspace = true

log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Local time for service titles and dates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Website sign-in returns through sanctuarymix:// links.
tauri-plugin-deep-link = "2"

# On Windows and Linux a sign-in link starts a second copy; this hands the link
# to the running app instead. macOS delivers links to the running app itself.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
